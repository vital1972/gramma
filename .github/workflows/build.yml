name: Сборка для Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Выпустить релиз (версия из package.json)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Тесты и проверка банка заданий
        run: node --test test/*.test.js

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Сборка установщика
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.release }}
        run: npm run dist
      - name: Тег версии для релиза кнопкой
        if: ${{ inputs.release && !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          V="v$(node -p "require('./package.json').version")"
          git tag "$V"
          git push origin "$V"
      - name: Сборка и выпуск релиза (по тегу v* или кнопкой)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release }}
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: DetectiveOshibkin-Setup
          path: dist/*.exe
