name: Сборка для Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Выпустить релиз (версия из package.json)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Тесты и проверка банка заданий
        run: node --test test/*.test.js

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Сборка установщика
        run: npm run dist
      - name: Выпуск релиза (по тегу v* или кнопкой)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          gh release view "$V" >/dev/null 2>&1 || gh release create "$V" --target "$GITHUB_SHA" --title "${V#v}" --notes "Детектив Ошибкин ${V#v}. Скачайте DetectiveOshibkin-Setup-${V#v}.exe и запустите."
          gh release upload "$V" "dist/DetectiveOshibkin-Setup-${V#v}.exe" "dist/DetectiveOshibkin-Setup-${V#v}.exe.blockmap" dist/latest.yml --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: DetectiveOshibkin-Setup
          path: dist/*.exe
